name: MCP tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  mcp-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run CI-safe MCP test layers
        run: npm run test:ci
